services:
  whatsvendedora-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatsvendedora-api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_started
    ports:
      - "3333:3333"
    environment:
      NODE_ENV: "production"
      PORT: "3333"
      EVOLUTION_API_URL: "http://evolution-api:8080"
      EVOAPICLOUD_API_URL: "http://evolution-api:8080"
      EVOLUTION_MANAGER_URL: "http://evolution-api:8080/manager"
      EVOAPICLOUD_MANAGER_URL: "http://evolution-api:8080/manager"
      PUBLIC_WEBHOOK_BASE_URL: "http://whatsvendedora-api:3333"
      POSTGRES_DATABASE_URL: "postgresql://evolution:evolution@evolution-postgres:5432/evolution"
      POSTGRES_SCHEMA: "whatsvendedora"
      WEBHOOK_QUEUE_REDIS_URL: "redis://evolution-redis:6379/7"
      WEBHOOK_QUEUE_NAME: "whatsvendedora-webhooks"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3333/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10

  evolution-postgres:
    image: postgres:16-alpine
    container_name: evolution-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
    ports:
      - "5432:5432"
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 10

  evolution-redis:
    image: redis:7-alpine
    container_name: evolution-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - evolution_redis_data:/data

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.6
    container_name: evolution-api
    restart: unless-stopped
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_started
      whatsvendedora-api:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      SERVER_TYPE: "http"
      SERVER_PORT: "8080"
      SERVER_URL: "http://localhost:8080"
      AUTHENTICATION_API_KEY: "${EVOLUTION_API_KEY}"
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"

      DATABASE_PROVIDER: "postgresql"
      DATABASE_CONNECTION_URI: "postgresql://evolution:evolution@evolution-postgres:5432/evolution?schema=public"
      DATABASE_CONNECTION_CLIENT_NAME: "testezap"
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      DATABASE_DELETE_MESSAGE: "false"

      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: "redis://evolution-redis:6379/6"
      CACHE_REDIS_TTL: "604800"
      CACHE_REDIS_PREFIX_KEY: "evolution"
      CACHE_LOCAL_ENABLED: "false"

      # Ajuste para um valor valido na sua rede.
      # Em Windows + Docker Desktop, host.docker.internal costuma funcionar.
      WEBHOOK_GLOBAL_URL: "${EVOLUTION_WEBHOOK_GLOBAL_URL}"
      WEBHOOK_GLOBAL_ENABLED: "${EVOLUTION_WEBHOOK_GLOBAL_ENABLED:-true}"
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_APPLICATION_STARTUP: "false"
      WEBHOOK_EVENTS_QRCODE_UPDATED: "true"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  evolution_postgres_data:
  evolution_redis_data:
