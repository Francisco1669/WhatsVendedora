version: "3.9"

# Stack base para subir Evolution API localmente.
# Se sua versao da Evolution usar variaveis diferentes, ajuste este arquivo.

services:
  evolution-api:
    image: atendai/evolution-api:latest
    container_name: evolution-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_TYPE: "http"
      SERVER_PORT: "8080"
      AUTHENTICATION_TYPE: "apikey"
      AUTHENTICATION_API_KEY: "${EVOLUTION_API_KEY}"
      # Ajuste para um valor valido na sua rede.
      # Em Windows + Docker Desktop, host.docker.internal costuma funcionar.
      WEBHOOK_GLOBAL_URL: "${EVOLUTION_WEBHOOK_GLOBAL_URL}"
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "true"
      WEBHOOK_EVENTS_APPLICATION_STARTUP: "false"
      WEBHOOK_EVENTS_QRCODE_UPDATED: "true"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
