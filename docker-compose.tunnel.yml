services:
  whatsvendedora-api:
    ports:
      - "3333:3333"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: whatsvendedora-cloudflared
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 1.0.0.1
    command: tunnel --no-autoupdate --protocol http2 --url http://whatsvendedora-caddy:80
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    depends_on:
      whatsvendedora-api:
        condition: service_healthy
    networks:
      - backend
      - public

networks:
  backend:
    external: false
  public:
    external: false
